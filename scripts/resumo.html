<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
html,body{margin:0;width:1200px;height:1500px;overflow:hidden}
body{background:#0d0b0c;color:#e9e0d2;font-family:"Source Serif 4",Georgia,serif;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(55% 40% at 15% 0%,rgba(209,69,47,.35),transparent 65%),radial-gradient(45% 40% at 90% 100%,rgba(143,182,216,.25),transparent 65%)}
.c{position:absolute;left:64px;top:56px;right:64px;bottom:48px;display:flex;flex-direction:column;gap:18px}
.olho{font-family:Cinzel,serif;font-size:18px;letter-spacing:.3em;text-transform:uppercase;color:#d1452f}
h1{font-family:Cinzel,serif;font-size:44px;margin:0;line-height:1.1}
.cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:22px}
h2{font-family:Cinzel,serif;font-size:19px;color:#caa353;margin:0 0 8px}
ol{margin:0;padding-left:22px;font-size:15.5px;line-height:1.35}
li{margin:4px 0}
.pend{border:1px solid #8fb6d8;border-radius:8px;padding:14px 18px}
.pend h2{color:#8fb6d8}
.pend ul{columns:2;column-gap:28px;margin:0;padding-left:20px;font-size:15.5px;line-height:1.35}
.url{font-family:Cinzel,serif;font-size:18px;letter-spacing:.12em;color:#caa353;margin-top:auto;text-align:right}
</style></head><body>
<div class="glow"></div>
<div class="c">
  <div><div class="olho">A Casa do Dragão · antes da última temporada</div><h1>O que lembrar antes da T4</h1></div>
  <div class="cols" id="cols"></div>
  <div class="pend"><h2>O que fica em aberto</h2><ul id="pend"></ul></div>
  <div class="url">digounet.github.io/got/antes-da-t4.html</div>
</div>
<script src="../js/dados.js"></script>
<script>
document.getElementById("cols").innerHTML = [1,2,3].map(t => `<div><h2>Temporada ${t}</h2><ol>${resumos[t].map(f => `<li>${f}</li>`).join("")}</ol></div>`).join("");
document.getElementById("pend").innerHTML = pendencias.map(p => `<li>${p}</li>`).join("");
</script>
</body></html>
