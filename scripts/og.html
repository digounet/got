<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Source+Serif+4:opsz,wght@8..60,400&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#0d0b0c;color:#e9e0d2;font-family:"Source Serif 4",Georgia,serif;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(55% 80% at 15% 0%,rgba(209,69,47,.38),transparent 65%),radial-gradient(45% 70% at 90% 5%,rgba(143,182,216,.3),transparent 65%)}
.conteudo{position:absolute;left:72px;top:64px;right:72px;bottom:56px;display:flex;flex-direction:column;justify-content:space-between}
.olho{font-family:Cinzel,serif;font-size:20px;letter-spacing:.3em;text-transform:uppercase;color:#d1452f}
h1{font-family:Cinzel,serif;font-weight:700;font-size:62px;line-height:1.1;margin:14px 0 18px;letter-spacing:.01em;text-shadow:0 0 30px rgba(209,69,47,.3)}
p{font-size:27px;line-height:1.35;color:#a3968b;margin:0;max-width:880px}
.fotos{display:flex;gap:14px}
.fotos img{width:80px;height:80px;border-radius:50%;object-fit:cover;object-position:top;border:3px solid #caa353;box-shadow:0 6px 18px rgba(0,0,0,.6)}
.rodape{display:flex;justify-content:space-between;align-items:flex-end}
.url{font-family:Cinzel,serif;font-size:22px;letter-spacing:.12em;color:#caa353}
.nota{font-size:20px;color:#8fb6d8}
</style></head><body>
<div class="glow"></div>
<div class="conteudo">
  <div>
    <div class="olho">Fogo e Sangue · Infográfico</div>
    <h1>Da Dança dos Dragões<br>ao Trono de Ferro</h1>
    <p>Todas as casas, personagens e dragões de A Casa do Dragão e o que liga cada um a Game of Thrones.</p>
  </div>
  <div class="rodape">
    <div class="fotos">
      <img src="../img/rhaenyra-targaryen.webp" alt=""><img src="../img/daemon-targaryen.webp" alt=""><img src="../img/alicent-hightower.webp" alt=""><img src="../img/aegon-ii-targaryen.webp" alt=""><img src="../img/aemond-targaryen.webp" alt=""><img src="../img/corlys-velaryon.webp" alt="">
    </div>
    <div style="text-align:right;flex:none;white-space:nowrap"><div class="url">digounet.github.io/got</div><div class="nota">Atualizado até a 3ª temporada</div></div>
  </div>
</div>
</body></html>
